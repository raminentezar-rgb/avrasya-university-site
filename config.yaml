# تنظیمات اصلی پروه
mt5:
  path: "C:/Program Files/MetaTrader 5/terminal64.exe"
  login: 12345678
  server: "BrokerServer"
  timeout: 5000

trading:
  symbol: "XAUUSD"
  timeframe: "M5"
