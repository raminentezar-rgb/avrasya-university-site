logging:
  level: "INFO"git status

git add .

git commit -m "Yeni sayfalar eklendi: [örneğin accounts ve aday_ogrenci klasörleri güncellendi]"

git push origin main

python manage.py runserver 8081
  file: "logs/trading.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

