{% extends 'tuition/base_payment.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-lg-5 col-md-7">
        <div class="glass-card fade-in-up text-center">
            <div class="mb-4">
                <div class="d-inline-flex justify-content-center align-items-center rounded-circle" style="width: 80px; height: 80px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);">
                    <i class="fa-solid fa-id-card fs-1 text-primary"></i>
                </div>
            </div>
            
            <h2 class="fw-bold mb-2">Öğrenci Sorgulama</h2>
            <p class="text-muted mb-4">Harç veya eğitim ücreti ödemesi yapmak için T.C. Kimlik veya Pasaport numaranızı giriniz.</p>

            <form method="POST" action="{% url 'tuition:index' %}">
                {% csrf_token %}
                <div class="mb-4 text-start">
                    <label for="student_id" class="form-label text-muted small fw-semibold text-uppercase tracking-wider">T.C. Kimlik / Pasaport No</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                        <input type="text" class="form-control with-icon" id="student_id" name="student_id" placeholder="Kimlik numaranızı giriniz" required autocomplete="off">
                    </div>
                </div>

                <button type="submit" class="btn btn-glow w-100 d-flex justify-content-center align-items-center gap-2">
                    Sorgula
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="mt-4 pt-3 border-top" style="border-color: var(--glass-border) !important;">
                <p class="small text-muted mb-0">
                    <i class="fa-solid fa-circle-info me-1"></i>
                    Bilgileriniz doğrudan OBS (Öğrenci Bilgi Sistemi) üzerinden anlık olarak çekilmektedir.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
