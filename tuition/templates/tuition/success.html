{% extends 'tuition/base_payment.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-lg-6 col-md-8">
        <div class="glass-card fade-in-up text-center">
            
            <div class="mb-4">
                <div class="d-inline-flex justify-content-center align-items-center rounded-circle" style="width: 100px; height: 100px; background: rgba(34, 197, 94, 0.1); border: 2px solid rgba(34, 197, 94, 0.5); box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);">
                    <i class="fa-solid fa-check fs-1 text-success"></i>
                </div>
            </div>
            
            <h2 class="fw-bold mb-3 text-white">Ödeme Başarılı!</h2>
            <p class="text-muted mb-4 fs-5">Harç ödemeniz başarıyla gerçekleştirilmiş ve OBS sistemine işlenmiştir.</p>
            
            <div class="p-4 rounded-3 text-start mb-4 mx-auto" style="background: rgba(15, 23, 42, 0.6); border: 1px dashed rgba(255,255,255,0.2); max-width: 400px;">
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2" style="border-color: rgba(255,255,255,0.1) !important;">
                    <span class="text-muted">İşlem Numarası</span>
                    <span class="fw-medium font-monospace text-white">AVR-{% widthratio 1 1 1 %}{% now "U" %}</span>
                </div>
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2" style="border-color: rgba(255,255,255,0.1) !important;">
                    <span class="text-muted">Tarih</span>
                    <span class="fw-medium text-white">{% now "d M Y H:i" %}</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Durum</span>
                    <span class="badge bg-success bg-opacity-25 text-success border border-success">Onaylandı</span>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3">
                <button onclick="window.print()" class="btn btn-outline-light px-4">
                    <i class="fa-solid fa-print me-2"></i>Dekont Yazdır
                </button>
                <a href="{% url 'core:home' %}" class="btn btn-glow px-4">
                    Ana Sayfaya Dön
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
