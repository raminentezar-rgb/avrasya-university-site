{% load i18n %}
<style>
/* ==========================================================================
   Avrasya University - Dynamic Faculty & Department Tabs Styling
   Strict Brand Palette: #092442, #1d61a9, #8dd4e3, #f6f2e7, #ffffff
   ========================================================================== */
.avrasya-dyn-tabs .tab-container {
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(9, 36, 66, 0.09);
    border: 1px solid rgba(141, 212, 227, 0.35);
}

.avrasya-dyn-tabs .tab-header {
    background: linear-gradient(135deg, #092442 0%, #1d61a9 100%);
    padding: 0;
}

.avrasya-dyn-tabs .tab-menu {
    display: flex;
    list-style: none;
    padding: 0;
    margin: 0;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(141, 212, 227, 0.45) transparent;
}

.avrasya-dyn-tabs .tab-menu::-webkit-scrollbar {
    height: 4px;
}

.avrasya-dyn-tabs .tab-menu::-webkit-scrollbar-thumb {
    background: rgba(141, 212, 227, 0.55);
    border-radius: 4px;
}

.avrasya-dyn-tabs .tab-menu-item {
    flex: 1 1 auto;
    min-width: auto;
    padding: 18px 12px;
    text-align: center;
    color: rgba(255, 255, 255, 0.86);
    font-weight: 600;
    font-size: 0.94rem;
    cursor: pointer;
    transition: all 0.28s ease;
    border-bottom: 4px solid transparent;
    border-inline-end: 1px solid rgba(255, 255, 255, 0.24);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
    white-space: nowrap;
}

.avrasya-dyn-tabs .tab-menu-item:last-child {
    border-inline-end: none;
}

.avrasya-dyn-tabs .tab-menu-item:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
}

.avrasya-dyn-tabs .tab-menu-item.active {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;

}

.avrasya-dyn-tabs .tab-menu-item i {
    font-size: 1.05rem;
    color: #8dd4e3;
}

.avrasya-dyn-tabs .tab-content {
    display: none;
    animation: avrasyaTabFadeIn 0.35s ease;
}

.avrasya-dyn-tabs .tab-content.active {
    display: block;
}

@keyframes avrasyaTabFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.avrasya-dyn-tabs .tab-content-header {

<script>
(function() {
    if (window.__avrasyaDynTabsBound) return;
    window.__avrasyaDynTabsBound = true;

    function activateTab(tabId) {
        if (!tabId) return;
        const target = document.getElementById(tabId);
        if (!target) return;

        const container = target.closest('.tab-container') || document;
        const menuItems = container.querySelectorAll('.tab-menu-item');
        const contents = container.querySelectorAll('.tab-content');

        menuItems.forEach(function(item) {
            item.classList.remove('active');
            if (item.getAttribute('data-tab') === tabId) {
                item.classList.add('active');
            }
        });
        contents.forEach(function(content) {
            content.classList.remove('active');
        });
        target.classList.add('active');
    }

    document.addEventListener('click', function(e) {
        const tabItem = e.target.closest('.tab-menu-item');
        if (tabItem) {
            const tabId = tabItem.getAttribute('data-tab');
            if (tabId) {
                activateTab(tabId);
            }
            return;
        }
        const switchBtn = e.target.closest('.tab-switch[href^="#"]');
        if (switchBtn) {
            e.preventDefault();
            const hashId = switchBtn.getAttribute('href').replace('#', '');
            activateTab(hashId);
            const target = document.getElementById(hashId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        if (window.location.hash) {
            const h = window.location.hash.replace('#', '');
            if (document.getElementById(h)) {
                activateTab(h);
            }
        }
    });
})();
</script>
